<!doctype html>
<html lang="en" style="background-color: #0F0F0F; color: #F7F7F7;">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/no background.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trawangan · Professional Crypto Charting Terminal</title>
    <style>
      html, body {
        background-color: #0F0F0F;
        color: #F7F7F7;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script>
      // Penangkap error runtime darurat dengan antarmuka Obsidian Precision
      function showTrawanganErrorCard(title, errorMsg) {
        var existing = document.getElementById('startup-error-card');
        if (existing) {
          var bodyEl = existing.querySelector('.error-card-msg');
          if (bodyEl) {
            bodyEl.innerText += '\n\n' + errorMsg;
          }
          return;
        }

        var card = document.createElement('div');
        card.id = 'startup-error-card';
        card.style.cssText = 'position:fixed;bottom:20px;left:20px;right:20px;max-width:680px;margin:0 auto;background:rgba(18,18,20,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(239,68,68,0.35);color:#F4F4F5;padding:12px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;z-index:999999;border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,0.8),0 0 1px rgba(239,68,68,0.3);box-sizing:border-box;animation:fadeInError 0.2s ease-out;';

        var header = document.createElement('div');
        header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.08);';

        var titleArea = document.createElement('div');
        titleArea.style.cssText = 'display:flex;align-items:center;gap:8px;font-weight:600;color:#FCA5A5;';
        titleArea.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#EF4444;box-shadow:0 0 8px #EF4444;"></span><span>' + title + '</span>';

        var actionsArea = document.createElement('div');
        actionsArea.style.cssText = 'display:flex;align-items:center;gap:6px;';

        var copyBtn = document.createElement('button');
        copyBtn.innerText = 'Salin Log';
        copyBtn.style.cssText = 'background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#D4D4D8;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;transition:all 0.15s ease;';
        copyBtn.onmouseenter = function() { copyBtn.style.background = 'rgba(255,255,255,0.12)'; copyBtn.style.color = '#FFFFFF'; };
        copyBtn.onmouseleave = function() { copyBtn.style.background = 'rgba(255,255,255,0.06)'; copyBtn.style.color = '#D4D4D8'; };
        copyBtn.onclick = function() {
          var fullText = title + '\n' + (msgContent ? msgContent.innerText : errorMsg);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fullText).then(function() {
              copyBtn.innerText = 'Tersalin!';
              setTimeout(function() { copyBtn.innerText = 'Salin Log'; }, 2000);
            });
          }
        };

        var closeBtn = document.createElement('button');
        closeBtn.innerHTML = '✕';
        closeBtn.title = 'Tutup dialog error (Esc)';
        closeBtn.style.cssText = 'background:transparent;border:none;color:#A1A1AA;padding:2px 6px;cursor:pointer;font-size:14px;font-weight:bold;line-height:1;border-radius:4px;transition:color 0.15s ease;';
        closeBtn.onmouseenter = function() { closeBtn.style.color = '#EF4444'; };
        closeBtn.onmouseleave = function() { closeBtn.style.color = '#A1A1AA'; };
        closeBtn.onclick = function() {
          card.remove();
        };

        actionsArea.appendChild(copyBtn);
        actionsArea.appendChild(closeBtn);
        header.appendChild(titleArea);
        header.appendChild(actionsArea);

        var msgContent = document.createElement('div');
        msgContent.className = 'error-card-msg';
        msgContent.style.cssText = 'max-height:120px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;color:#E4E4E7;line-height:1.45;background:rgba(0,0,0,0.3);padding:8px;border-radius:4px;border:1px solid rgba(255,255,255,0.04);';
        msgContent.innerText = errorMsg;

        var footer = document.createElement('div');
        footer.style.cssText = 'margin-top:6px;font-size:10px;color:#71717A;display:flex;justify-content:space-between;align-items:center;';
        footer.innerHTML = '<span>Terminal Diagnostic</span><span>Tekan <kbd style="background:rgba(255,255,255,0.1);padding:1px 4px;border-radius:3px;">Esc</kbd> untuk menutup</span>';

        card.appendChild(header);
        card.appendChild(msgContent);
        card.appendChild(footer);
        document.body.appendChild(card);
      }

      window.addEventListener('error', function(event) {
        console.error('[TRAWANGAN_STARTUP_ERROR]', event.error || event.message);
        var msg = (event.error && (event.error.stack || event.error.message)) || event.message || 'Unknown runtime error';
        showTrawanganErrorCard('⚠️ Runtime Error', msg);
      });

      window.addEventListener('unhandledrejection', function(event) {
        console.error('[TRAWANGAN_UNHANDLED_REJECTION]', event.reason);
        var msg = (event.reason && (event.reason.stack || event.reason.message || event.reason)) || 'Unknown promise rejection';
        showTrawanganErrorCard('⚠️ Unhandled Promise Rejection', String(msg));
      });

      window.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          var card = document.getElementById('startup-error-card');
          if (card) {
            card.remove();
          }
        }
      });
    </script>
    %sveltekit.head%
  </head>
  <body style="background-color: #0F0F0F; color: #F7F7F7;" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
