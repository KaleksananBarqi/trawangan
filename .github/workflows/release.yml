name: release trawangan

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (contoh: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag_info
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v0.1.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag_info.outputs.tag }}
          releaseName: 'trawangan ${{ steps.tag_info.outputs.tag }}'
          releaseBody: |
            ## ꦠꦿꦮꦔꦤ꧀ · trawangan ${{ steps.tag_info.outputs.tag }}
            
            > **Professional Desktop Crypto Charting Terminal — Zero Paywall**
            
            Aplikasi desktop native ultra-ringan untuk analisis teknikal, charting WebGL2 berkecepatan tinggi, dan eksekusi Pine Script v6 tanpa paywall.
            
            ### ⚖️ Keunggulan Zero-Paywall Parity:
            - **Indikator Simultan:** Bebas pasang indikator tanpa batas kuota.
            - **Kapasitas Watchlist:** Simpan simbol tanpa batas.
            - **Pine Script v6:** Dijalankan secara lokal via PineTS Web Worker.
            - **Privasi:** 100% Offline SQLite lokal, tanpa pelacak atau telemetri.
            - **Engine:** LuxAlgo Vela WebGL2 akselerasi GPU (60-120 FPS).
            
            ### 📦 Paket Installer Biner Resmi:
            - **Windows**: `.exe` (NSIS Setup) & `.msi`
            - **Linux**: `.AppImage` (Universal Linux) & `.deb` (Debian/Ubuntu)
            - **macOS**: `.dmg` & `.app` (Apple Silicon & Intel)
            
            ---
            *Filosofi: Penerawangan (ꦠꦿꦮꦔꦤ꧀) — Visi menembus kabut manipulasi pasar.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload build artifacts as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trawangan-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: ignore
