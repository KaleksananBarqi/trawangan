name: release trawangan

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (contoh: v0.1.0)'
        required: true
        default: 'v0.1.0'
      platform:
        description: 'Target Platform'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'ubuntu-22.04'
          - 'windows-latest'
          - 'macos-latest'

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ (github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && inputs.platform != '') && fromJSON(format('["{0}"]', inputs.platform)) || fromJSON('["windows-latest", "ubuntu-22.04", "macos-latest"]') }}

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Determine release tag
        id: tag_info
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v0.1.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 5
        run: |
          APT_OPTS="-o APT::Update::Error-Mode=any -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=60"
          use_fallback_mirrors() {
            echo "Default Ubuntu mirror unreachable/unresolvable; switching apt mirrors to fallback..."
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' \
                $'https://mirrors.edge.kernel.org/ubuntu/\tpriority:1' \
                $'https://mirror.rackspace.com/ubuntu/\tpriority:2' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo sed -i -E 's|https?://[a-zA-Z0-9.-]*ubuntu\.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' /etc/apt/sources.list
            sudo find /etc/apt/sources.list.d/ -type f -name '*.list' -exec sed -i -E 's|https?://[a-zA-Z0-9.-]*ubuntu\.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' {} + 2>/dev/null || true
          }
          if ! curl -sfI --max-time 5 http://azure.archive.ubuntu.com/ubuntu/dists/jammy/InRelease >/dev/null 2>&1; then
            use_fallback_mirrors
          fi
          for attempt in 1 2; do
            if sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS update && sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2; then
              exit 0
            fi
            echo "apt-get attempt $attempt failed, switching to fallback mirrors and retrying in 5s..."
            use_fallback_mirrors
            sleep 5
          done
          exit 1

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract Changelog Notes
        id: changelog_extract
        shell: bash
        run: |
          TAG="${{ steps.tag_info.outputs.tag }}"
          NOTES=$(node scripts/extract-changelog.cjs "$TAG")
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: ${{ steps.tag_info.outputs.tag }}
          releaseName: 'trawangan ${{ steps.tag_info.outputs.tag }}'
          releaseBody: |
            ## ꦠꦿꦮꦔꦤ꧀ · trawangan ${{ steps.tag_info.outputs.tag }}
            
            > **Professional Desktop Crypto Charting Terminal — Zero Paywall**
            
            ${{ steps.changelog_extract.outputs.notes }}
            
            ---
            ### ⚖️ Keunggulan Zero-Paywall Parity:
            - **Indikator Simultan:** Bebas pasang indikator tanpa batas kuota.
            - **Kapasitas Watchlist:** Simpan simbol tanpa batas.
            - **Pine Script v6:** Dijalankan secara lokal via PineTS Web Worker.
            - **Privasi:** 100% Offline SQLite lokal, tanpa pelacak atau telemetri.
            - **Engine:** LuxAlgo Vela WebGL2 akselerasi GPU (60-120 FPS).
            
            ### 📦 Paket Installer Biner Resmi:
            - **Windows**: `.exe` (NSIS Setup) & `.msi`
            - **Linux**: `.AppImage` (Universal Linux) & `.deb` (Debian/Ubuntu)
            - **macOS**: `.dmg` & `.app` (Apple Silicon & Intel)
            
            ---
            *Filosofi: Penerawangan (ꦠꦿꦮꦔꦤ꧀) — Visi menembus kabut manipulasi pasar.*
          releaseDraft: false
          prerelease: false
          args: ''

      - name: Upload build artifacts as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trawangan-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: ignore
